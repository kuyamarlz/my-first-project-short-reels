@keyframes malwareFall {

@media (prefers-reduced-motion: reduce) {

const $ = id => document.getElementById(id);

let started = false;
let audioContext = null;
let soundEnabled = false;
let timers = [];
let intervals = [];

function later(fn, ms) {
    const id = setTimeout(fn, ms);
    timers.push(id);
    return id;
}

function every(fn, ms) {
    const id = setInterval(fn, ms);
    intervals.push(id);
    return id;
}

function show(id) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.style.display = "none";
    });

    const target = $(id);

    if (
        id === "countdownScreen" ||
        id === "upload" ||
        id === "gotcha"
    ) {
        target.style.display = "flex";
    } else {
        target.style.display = "block";
    }
}

function initSound() {
    try {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        soundEnabled = true;

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }
    } catch (error) {
        soundEnabled = false;
    }
}

function tone(
    freq = 440,
    duration = 0.12,
    type = "sine",
    volume = 0.08
) {
    if (!soundEnabled || !audioContext) return;

    try {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;

        oscillator.frequency.setValueAtTime(
            freq,
            audioContext.currentTime
        );

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
    } catch (error) {}
}

function beep() {
    tone(720, 0.09, "square", 0.045);

function alarm() {
    tone(880, 0.2, "sawtooth", 0.06);

}

/* Added animated malware code generator */
function createMalwareCode() {
    const container = $("malwareCode");

    if (!container || container.dataset.ready === "yes") {
        return;
    }

    container.dataset.ready = "yes";

    const width = window.innerWidth;
    const columnCount = Math.min(
        24,
        Math.ceil(width / 55)
    );

    const symbols = "0123456789ABCDEF<>[]{}#$%&";

        column.className = "malware-column";

        column.style.animationDuration =
            (5 + Math.random() * 8) + "s";

        column.style.animationDelay =
            (-Math.random() * 10) + "s";

        column.style.opacity =
            (0.25 + Math.random() * 0.6).toFixed(2);

        let code = "";

        for (let j = 0; j < 35; j++) {
            for (let k = 0; k < 4; k++) {
                code += symbols[
                    Math.floor(Math.random() * symbols.length)
                ];
            }

            code += "\n";
        }

        column.textContent = code;
        container.appendChild(column);
    }
}
